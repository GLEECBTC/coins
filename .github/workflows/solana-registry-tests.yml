name: Solana registry contracts

on:
  pull_request:
    paths:
      - coins
      - "solana/**"
      - "explorers/**"
      - "utils/**"
      - ".github/workflows/solana-registry-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: utils/requirements.txt
      - name: Install generator dependencies
        run: python -m pip install -r utils/requirements.txt
      - name: Test scanner, generator, and immutable candidate fixtures
        run: python -B -m unittest discover -s utils/tests -p test_solana_registry.py -v
